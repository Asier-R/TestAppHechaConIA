<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiCirc - Diseñador y Simulador de Circuitos Lógicos</title>
    <meta name="description" content="Aplicación interactiva CAD para crear, simular y exportar planos de circuitos electrónicos con DSL formal bidireccional, auto-posicionamiento, chips personalizados, colaboración y asistente IA." />
    <meta property="og:title" content="LogiCirc - Diseñador y Simulador de Circuitos Lógicos" />
    <meta property="og:description" content="Aplicación interactiva CAD para crear, simular y exportar planos de circuitos electrónicos con DSL formal bidireccional, auto-posicionamiento, chips personalizados, colaboración y asistente IA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Gracefully handle harmless WebSocket connection errors from disabled HMR in AI Studio iframe
      window.addEventListener('error', function(event) {
        if (
          event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('@vite/client') ||
            (event.filename && event.filename.includes('@vite/client'))
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        const reason = String(event.reason || '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          (event.reason && event.reason.stack && event.reason.stack.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
